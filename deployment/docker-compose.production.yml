# =============================================================================
# UrsBiz — production overlay (canonical).
#
# Sprint H5.6 — this is the SINGLE canonical production compose file.
# A duplicate at the repository root (`docker-compose.prod.yml`) has
# been removed; use only this file via:
#
#   docker compose \n#     -f docker-compose.yml \n#     -f deployment/docker-compose.production.yml \n#     --env-file deployment/env/.env.production \n#     up -d
#
# Use on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the base file:
#   - Production env file (.env.production.example).
#   - Higher gunicorn worker count (sized for the typical 2-CPU prod box).
#   - Public port 80 on the host (no :8080 prefix). nginx still listens
#     on 80 inside the container.
#   - `read_only: true` and tmpfs where the app needs to write.
#   - Resource limits to keep the boxes predictable.
#   - No host port for backend/frontend (they are internal-only).
#   - extra healthcheck retries + longer start_period (cold start).
# =============================================================================

name: ursbiz

services:
  backend:
    image: ursbiz/backend:${TAG:-latest}
    restart: always
    env_file:
      - ./deployment/env/.env.production.example
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "2"
      LOG_LEVEL: INFO
    # Sprint 8 Part 3 — hardened container posture.
    read_only: true
    # Drop every Linux capability the process does not need. The
    # backend is a pure HTTP server; it does not need NET_RAW,
    # SYS_ADMIN, etc. The default set Docker grants is overly
    # permissive for production.
    cap_drop:
      - ALL
    # `no-new-privileges` blocks setuid escalation even if a future
    # image accidentally ships a setuid binary. The Linux kernel
    # enforces this for child processes started after the option
    # is set.
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - backend-data:/var/lib/ursbiz
      - backend-logs:/var/log/ursbiz
    networks:
      - ursbiz-net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ursbiz/frontend:${TAG:-latest}
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ursbiz.example.com/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-UrsBiz}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://ursbiz.example.com}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Sprint 8 Part 3 — hardened container posture.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    networks:
      - ursbiz-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: ursbiz-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    # Sprint 8 Part 3 — hardened container posture.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - ursbiz-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------- #
  # Sprint 8 Part 2 — Monitoring & Observability.
  #
  # Both services run on the same `ursbiz-net` so Prometheus can
  # scrape the backend container by service name and Grafana can
  # query Prometheus without any external network. Neither container
  # has a host port — operators reach Grafana through the existing
  # nginx proxy (or via `docker exec`) so we don't add another
  # attack surface.
  # ---------------------------------------------------------------- #
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ursbiz-prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle=false"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ursbiz-net
    depends_on:
      backend:
        condition: service_healthy
    # Sprint 8 Part 3 — hardened container posture.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ursbiz-grafana
    restart: always
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployment/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ursbiz-net
    # Sprint 8 Part 3 — hardened container posture.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ursbiz-net:
    driver: bridge

volumes:
  backend-data:
    driver: local
  backend-logs:
    driver: local
  nginx-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
