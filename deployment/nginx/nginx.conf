# =============================================================================
# Nginx — reverse proxy for Atlas AI.
#
# Responsibilities:
#   - Terminate HTTP/1.1 + HTTP/2 for the public browser.
#   - Forward /api/* traffic to the backend container (gunicorn+uvicorn).
#   - Forward everything else to the frontend container (next standalone).
#   - Enable gzip, websocket upgrade, OCR upload sizing, cache headers,
#     and the standard security header set.
#
# This file is mounted into the nginx container at /etc/nginx/nginx.conf.
# It does not serve as the default site; the server block below is the
# only site in the container, listening on port 80. Operators that want
# TLS should terminate it on a load balancer or add a second server
# block listening on 443; doing TLS in-container couples certificate
# renewal to the image lifecycle and is intentionally out of scope.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging format ---------------------------------------------------- #
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # --- Performance ------------------------------------------------------ #
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # --- Upload sizing ---------------------------------------------------- #
    # OCR uploads are multipart/form-data with attached scans. We allow
    # 25 MB request bodies so a 20-page scan fits with metadata. The
    # backend gunicorn config matches this so neither layer truncates.
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # --- Gzip ------------------------------------------------------------- #
    # Compress text responses (HTML, CSS, JS, JSON, SVG) to cut the
    # bandwidth the browser pulls. We deliberately exclude already-
    # compressed image formats (png/jpg/webp) because re-compressing
    # them wastes CPU for no size win.
    #
    # Sprint 8 Part 4 — higher compression level (5 → 6 is the
    # sweet spot on modern x86; the CPU cost is negligible at our
    # request volume) and a wider gzip_types list so /api JSON
    # responses (which dominate the bytes-on-the-wire) get
    # compressed even when the backend's GZipMiddleware is bypassed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        application/x-ndjson
        application/manifest+json
        font/woff
        font/woff2
        image/svg+xml;

    # --- Open file cache ------------------------------------------------- #
    # nginx opens a new file descriptor for every static asset by
    # default. The open_file_cache keeps the descriptor / size /
    # mtime around so repeated requests hit the page cache
    # instead of the syscall path. The 8h TTL matches the
    # /_next/static/ `expires 1y` cache header — the file is
    # content-hashed so a stale descriptor would not serve a
    # wrong asset.
    open_file_cache max=1024 inactive=8h;
    open_file_cache_valid 1h;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- Proxy defaults --------------------------------------------------- #
    # We use variable-form upstream names (e.g. `proxy_pass
    # http://atlas_backend`) so the container DNS is consulted at
    # request time. Static `upstream { server backend:8000; }`
    # blocks resolve the hostname at config-parse time, which
    # makes `nginx -t` fail when run outside the compose network
    # (the test target has no DNS for the service name). The
    # `resolver` directive above + the variable form below let
    # `nginx -t` succeed against the host network and keep
    # runtime behaviour correct inside compose.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Build the upstream URLs once so the server block can pass
    # them to proxy_pass. The set is wrapped in `map` so it
    # computes once per request and the variable is pure.
    map_hash_bucket_size 128;
    map $host $atlas_backend_upstream {
        default "http://backend:8000";
    }
    map $host $atlas_frontend_upstream {
        default "http://frontend:3000";
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_redirect off;
    proxy_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Upstream routing. The container DNS resolves the hostnames
    # in the `map $host $atlas_*_upstream` directives (above) at
    # request time. We use the variable-form `proxy_pass` so the
    # resolution happens lazily — `nginx -t` does not need the
    # `backend` / `frontend` hostnames to exist on the test host
    # (they are only resolvable inside the compose network).

    # --- Server block ----------------------------------------------------- #
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ----------------------------------------------------------------- //
        # API + docs + health: forward to the backend container.
        # ----------------------------------------------------------------- //
        location /api/ {
            proxy_pass $atlas_backend_upstream;
            # Strip the incoming Connection header so we can set our own
            # upgrade-aware header in the websocket rule below.
            proxy_set_header Connection "";

            # The backend has its own CORS / auth flow; we do not add
            # another layer here. We do append the X-Forwarded-* chain
            # (set in proxy_set_header above) so the backend knows it
            # is being reached through the proxy.
        }

        # FastAPI auto-generated OpenAPI / Swagger UIs.
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass $atlas_backend_upstream;
            proxy_set_header Connection "";
        }

        # Backend liveness probe — no auth, no rate limit.
        location = /api/v1/health {
            proxy_pass $atlas_backend_upstream;
            access_log off;
        }

        # Monitoring surface (Sprint 8 Part 2). All four routes
        # are proxied straight to the backend container:
        #   /health         — full diagnostic (200, always)
        #   /health/live    — liveness probe
        #   /health/ready   — readiness probe (200 / 503)
        #   /metrics        — Prometheus exposition format
        # We strip /metrics from the access log so the scraper
        # doesn't dominate the log volume.
        location = /health {
            proxy_pass $atlas_backend_upstream;
            access_log off;
        }
        location = /health/live {
            proxy_pass $atlas_backend_upstream;
            access_log off;
        }
        location = /health/ready {
            proxy_pass $atlas_backend_upstream;
            access_log off;
        }
        location = /metrics {
            proxy_pass $atlas_backend_upstream;
            access_log off;
        }

        # OCR uploads: the frontend posts multipart/form-data with file
        # attachments. We forward as-is; nginx has already applied
        # client_max_body_size above.
        location ~ ^/api/v1/.+\.(ocr|upload|scan) {
            proxy_pass $atlas_backend_upstream;
            proxy_set_header Connection "";
            proxy_request_buffering off;  # stream the body to the backend
            proxy_read_timeout 120s;       # OCR can be slow
        }

        # ----------------------------------------------------------------- //
        # WebSocket upgrade: any request that asks for upgrade goes to the
        # backend (the assistant chat / live updates channel). The
        # Connection: upgrade pair is required by RFC 7230; nginx handles
        # the 101 handshake.
        # ----------------------------------------------------------------- //
        location /ws/ {
            proxy_pass $atlas_backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ----------------------------------------------------------------- //
        # Static asset cache headers: long-lived cache for the Next.js
        # /_next/static/* folder. Next fingerprints these files so a
        # 1-year cache is safe.
        # ----------------------------------------------------------------- //
        location /_next/static/ {
            proxy_pass $atlas_frontend_upstream;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable, max-age=31536000";
            access_log off;
        }

        # ----------------------------------------------------------------- //
        # Everything else: forward to the frontend container. The Next
        # standalone server handles SSR + static + client routing.
        # ----------------------------------------------------------------- //
        location / {
            proxy_pass $atlas_frontend_upstream;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------------- //
        # Security headers: applied to every response this server emits.
        # Sprint 8 Part 3 — also sets Content-Security-Policy, COOP /
        # CORP, and a Referrer-Policy. The header set is the OWASP
        # recommended baseline. HSTS is intentionally omitted here
        # because the image only listens on plaintext HTTP; the
        # operator that fronts the deployment with TLS should add
        # `Strict-Transport-Security: max-age=31536000; includeSubDomains`
        # at the load balancer.
        # ----------------------------------------------------------------- //
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        # HSTS would normally be set here, but we only listen on HTTP
        # (port 80) in this image. If you front this with TLS, enable
        # Strict-Transport-Security at the load balancer.

        # Custom 502 / 504 / 503 error pages.
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 502 '{"error":"backend unavailable","status":502}';
        }
    }
}
