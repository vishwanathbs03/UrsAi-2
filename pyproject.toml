[tool.pytest.ini_options]
# Prepend ``backend/`` to sys.path so test modules that do
# ``from app.utils.database import Base`` (e.g. conftest.py) can
# resolve the package whether pytest is invoked from the repo
# root (``python -m pytest``) or from ``backend/`` itself.
pythonpath = ["backend"]
# Restrict pytest test discovery to the actual repository test suite.
# Debug scripts (e.g. scripts/debug/test_backend_ai.py) live outside
# this path and must NOT participate in repository verification.
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]