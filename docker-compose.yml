version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - APP_PORT=8001
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./atlas_ai.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # JWT_SECRET_KEY MUST be set in your shell environment or a .env file.
      # There is NO insecure default — the backend will reject startup if unset.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_PROVIDER=${AI_PROVIDER:-placeholder}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    depends_on:
      - backend
